<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop | DELL THOUGH</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
</head>
<body>
    <header>
        <h1>DELL THOUGH</h1>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Shop</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="account.html" id="accountLink" style="display:none;">Account</a></li>
                <li><a href="sign.html" id="signupLink">Sign Up</a></li>
                <li><a href="login.html" id="loginLink">Login</a></li>
            </ul>
        </nav>
    </header>

    <main style="text-align: center; padding: 20px;">
        <h2>2026 Headphone Collection</h2>
        
        <div id="product-grid" class="product-grid">
            <!-- Products will be loaded here -->
        </div>
    </main>

    <footer>
        <p>© 2026 Tech Tech ni Jovan. All rights reserved</p>
    </footer>

    <script>
        function checkLogin() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn) {
                document.getElementById('accountLink').style.display = 'inline';
                document.getElementById('signupLink').style.display = 'none';
                document.getElementById('loginLink').style.display = 'none';
            }
        }

        async function fetchProducts() {
            try {
                const headers = {};
                const token = localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch('http://localhost:8080/api/v1/products', { headers });
                if (response.ok) {
                    const products = await response.json();
                    displayProducts(products);
                } else if (response.status === 401) {
                    alert('Please log in to view products.');
                    window.location.href = 'login.html';
                } else {
                    alert('Failed to load products.');
                }
            } catch (error) {
                console.error('Error fetching products:', error);
                alert('Error loading products.');
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            products.forEach(product => {
                const article = document.createElement('article');
                article.innerHTML = `
                    <img src="${product.imageUrl || 'placeholder.jpg'}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <p class="price">₱${product.price}</p>
                    <button type="button" onclick="viewProduct(${product.id})">View Details</button>
                `;
                grid.appendChild(article);
            });
        }

        function viewProduct(id) {
            window.location.href = `product-view.html?id=${id}`;
        }

        checkLogin();
        fetchProducts();
    </script>
</body>
</html>
