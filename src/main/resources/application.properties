# EcommerceApi Application Configuration
# Server port
server.port=8080

# Application name
spring.application.name=EcommerceApi

# Logging configuration
logging.level.org.springframework.web=INFO
logging.level.com.ws101.deleon=DEBUG

# Spring Boot DevTools Configuration (Auto-Reload on Save)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2000
spring.devtools.restart.quiet-period=1000

# Test change for live reload
app.test.live-reload=enabled

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:ecommerce
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-very-important-32-chars-minimum
jwt.expiration=86400000